# Cloudflare Tunnel ingress for MimePool, for a cloudflared that runs ON THE HOST with a locally-managed tunnel.
# Copy to /etc/cloudflared/config.yml and replace <TUNNEL_ID> and the hostname.
# Not needed when:
#  - the tunnel is managed from the Cloudflare dashboard: add a Public Hostname there instead, or
#  - cloudflared runs as the compose service (`docker compose --profile tunnel up -d`): the dashboard
#    hostname then points at http://app:28787.
# The tunnel carries HTTPS and WebSocket (/ws); no inbound web port is opened on the server.
tunnel: <TUNNEL_ID>
credentials-file: /etc/cloudflared/<TUNNEL_ID>.json

ingress:
  - hostname: mimepool.example.com
    service: http://127.0.0.1:28787
  - service: http_status:404
